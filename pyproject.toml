[project]
name = "PyMaiView"
version = "0.1.0"
description = "Render maimai chart preview videos with Web mai Chart X and Playwright"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.45,<2",
]

[project.scripts]
pymaiview = "pymaiview.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
