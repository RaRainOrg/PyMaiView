name: Publish Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release to publish
        required: true
        type: choice
        options:
          - v0.1.0

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name || inputs.release_tag }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PyMaiView
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Download distributions from the GitHub Release
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pymaiview-*.whl' \
            --pattern 'pymaiview-*.tar.gz' \
            --dir dist

      - name: Verify release distributions
        shell: bash
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -type f -name 'pymaiview-*.whl' | wc -l | tr -d ' ')
          sdist_count=$(find dist -maxdepth 1 -type f -name 'pymaiview-*.tar.gz' | wc -l | tr -d ' ')
          test "$wheel_count" -eq 1
          test "$sdist_count" -eq 1
          ls -lh dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
